# The gate, run for real.
#
# `bun run check` is the contract (tsc + schema drift + tests) but it only covers the root
# package: `server/` and `mcp/` are separate packages with their own deps and tsconfigs, and
# nothing was typechecking them outside a developer remembering to. This runs all three, then
# builds the three images — because the build contexts differ on purpose (api from ./server,
# web and mcp from the repo root) and a wrong path there only shows up at deploy time.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Queue runs on the same ref rather than cancelling them: since the `deploy` job below is
# what puts main in production, a cancelled run leaves main green and undeployed, and two
# pushes in quick succession would otherwise deploy out of order.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest

    # The API's route tests drive the real app against a real Postgres — the invariants they
    # protect (who can see which rows, what a PUT leaves alone) are SQL invariants, and a mock
    # would only test the mock. The database name has to contain "test": the suite truncates,
    # and refuses to run anywhere that isn't clearly disposable.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: thumbtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/thumbtest

    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2"

      # Root install also covers the tests that reach into server/src (that's why ajv is a
      # root devDep) — but those tests import the API itself, so its deps have to be there
      # too or `bun test` fails on `hono`. Separate packages, separate installs: their
      # tsconfigs resolve from their own node_modules as well.
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: server
      - run: bun install --frozen-lockfile
        working-directory: mcp
      # `render/` is a package like the other two and was typechecked by nobody — its image is
      # built below, but a Dockerfile that copies broken TypeScript builds happily.
      - run: bun install --frozen-lockfile
        working-directory: render

      # One command, whole suite: with DATABASE_URL set, `check` also runs the API tests that
      # skip themselves on a machine with no Postgres.
      - run: bun run check

      - run: bunx tsc --noEmit -p server
      - run: bunx tsc --noEmit -p mcp
      - run: bunx tsc --noEmit -p render

      # The nginx config is deployed code too, and its only failure mode is at startup. This
      # catches a broken directive (or a missing include) in CI instead of on the VPS.
      - name: nginx config parses
        run: |
          docker run --rm \
            -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/nginx-headers.conf:/etc/nginx/snippets/headers.conf:ro" \
            nginx:1.27-alpine nginx -t

  images:
    name: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Build only — nothing is pushed. Deploys are Dokploy's job; this just proves the three
      # Dockerfiles still build from the contexts docker-compose gives them.
      - name: web (nginx, repo root)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: api (bun, ./server)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: server/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: mcp (bun, repo root)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: mcp/Dockerfile
          push: false
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,mode=max,scope=mcp

      # The heaviest image by far (Chromium). Worth building: its base tag and the
      # playwright-core version have to stay in lockstep, and nothing else would catch a
      # mismatch until a deploy.
      - name: render (playwright + bun, ./render)
        uses: docker/build-push-action@v6
        with:
          context: ./render
          file: render/Dockerfile
          push: false
          cache-from: type=gha,scope=render
          cache-to: type=gha,mode=max,scope=render

  deploy:
    name: deploy
    # Only a real push to main reaches production — never a pull request, never a branch.
    # Dokploy's own auto-deploy is off, so this job is the only thing that puts main in
    # production, and it runs behind both gates: a wrong Dockerfile context has to fail in
    # `images` rather than halfway through a deploy.
    needs: [check, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    # The mini PC publishes Dokploy on a tunnel hostname whose path rule allows
    # `api/compose\.(deploy|one)` and nothing else, so what is reachable from the internet is
    # these two calls rather than the whole admin API. The key is a repository secret and
    # lives nowhere else — in particular not in the Dokploy environment this deploy writes.
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}

    steps:
      # The compose status alone cannot say whether a deploy has started yet: it still reads
      # "done" from the previous one for the first few seconds. The id of the newest
      # deployment is what tells this run apart from the last — newest by createdAt, because
      # Dokploy returns the list oldest first.
      - name: Note the current deployment
        run: |
          echo "before=$(curl -fsS --max-time 30 \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            "$DOKPLOY_URL/api/compose.one?composeId=$DOKPLOY_COMPOSE_ID" |
            python3 -c 'import json,sys; d=sorted(json.load(sys.stdin)["deployments"], key=lambda x: x["createdAt"]); print(d[-1]["deploymentId"] if d else "")')" >> "$GITHUB_ENV"

      - name: Trigger the Dokploy deploy
        run: |
          curl -fsS --max-time 60 -X POST \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H 'content-type: application/json' \
            -d "{\"composeId\":\"$DOKPLOY_COMPOSE_ID\"}" \
            "$DOKPLOY_URL/api/compose.deploy"

      # The trigger only queues the build. Without this wait a red deploy still shows a green
      # workflow, which is the one thing this job exists to stop. The window is generous
      # because `render` is a Chromium image: a cold build of it is minutes, not seconds.
      - name: Wait for the deploy to finish
        run: |
          for _ in $(seq 1 160); do
            sleep 15
            latest="$(curl -fsS --max-time 30 \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              "$DOKPLOY_URL/api/compose.one?composeId=$DOKPLOY_COMPOSE_ID" |
              python3 -c 'import json,sys; d=sorted(json.load(sys.stdin)["deployments"], key=lambda x: x["createdAt"]); print(d[-1]["deploymentId"], d[-1]["status"]) if d else print("none idle")')"
            id="${latest%% *}"
            status="${latest##* }"
            if [ "$id" = "$before" ]; then
              echo "waiting for Dokploy to pick up the deploy"
              continue
            fi
            echo "deployment $id: $status"
            case "$status" in
              done) exit 0 ;;
              error) echo "::error::Dokploy reported a failed deploy"; exit 1 ;;
            esac
          done
          echo "::error::deploy still running after 40 minutes"
          exit 1

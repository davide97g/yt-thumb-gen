  <path d="M17 41 q9 7.5 20 1" stroke="#15151a" stroke-opacity="0.32" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <circle cx="45.5" cy="18" r="2.3" fill="#15151a" />
</svg>

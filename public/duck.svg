<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="duck/ui">
  <!--
    The duck/ui mark as a standalone asset, so the registry can ship it into a
    consumer's public/ and the loading path stays same-origin. Same geometry as
    DuckMark (registry/duck/ui/duck-mark.tsx); currentColor is baked to duck
    lime here because an <img> inherits nothing from the page.
  -->

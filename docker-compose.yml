# Full deployment unit: static SPA (nginx) + Bun API + Postgres. Built by Dokploy from
# this repo. Only `web` is exposed to Traefik; `api` and `postgres` stay on the internal
# network. Secrets come from the Dokploy environment (see .env.example) — nothing real
# is committed here.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thumb}
      POSTGRES_DB: ${POSTGRES_DB:-thumb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-thumb} -d ${POSTGRES_DB:-thumb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-thumb}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-thumb}
      APP_URL: ${APP_URL:-http://localhost}
      # Clerk holds the credential; this service verifies its sessions and decides which of them
      # this workspace serves. Without CLERK_SECRET_KEY nobody can sign in (the API says so at
      # /api/auth/status rather than failing silently). ALLOWED_EMAILS is the gate a Google
      # button needs — unset, it falls back to "the first account claims the instance".
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY}
      CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:-}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
      THUMBDOC_VALIDATE: ${THUMBDOC_VALIDATE:-warn}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      BLOB_GC: ${BLOB_GC:-dry-run}
      # Unset this and /api/projects/:id/render.png answers 503 with an explanation — the
      # renderer is optional, and the editor doesn't need it.
      RENDER_URL: http://render:3002
    # `/api/health` runs SELECT 1 and 503s if it can't — the route existed and nothing polled
    # it, so a container that had lost Postgres stayed in rotation looking fine. Curl and wget
    # are not guaranteed in the Bun image; bun itself is.
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:3000/api/health')).ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  # Hosted MCP endpoint (nginx routes /api/mcp here, ahead of /api/). Built from the repo
  # root because it needs the document model in src/ as well as server/src/. Holds no
  # secrets and no state: it forwards the caller's bearer to `api`, which owns auth.
  mcp:
    build:
      context: .
      dockerfile: mcp/Dockerfile
    restart: unless-stopped
    environment:
      THUMB_API_INTERNAL: http://api:3000
      APP_URL: ${APP_URL:-http://localhost}
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:3001/api/mcp/health')).ok ? 0 : 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    depends_on:
      - api

  # Headless renderer: a Chromium that loads /render.html from `web` and screenshots the real
  # canvas component, so a picture of a design and an export of it are the same code. Holds no
  # secrets and never touches the database — `api` authenticates the caller, then hands it a
  # document. Not routed by nginx: nothing outside this network may reach it.
  render:
    build:
      context: ./render
      dockerfile: Dockerfile
    restart: unless-stopped
    # Chromium needs more than the default 64 MB of /dev/shm or it dies mid-screenshot.
    shm_size: "512mb"
    environment:
      APP_ORIGIN: http://web
    # This service's real failure is a wedged Chromium, not a dead process — which is exactly
    # what its /health answers, since it asks for the page rather than for a status flag. The
    # interval is longer and the start period generous: booting the browser and loading the
    # render bundle is the slow part, and it only happens once.
    healthcheck:
      test: ["CMD", "bun", "-e", "process.exit((await fetch('http://127.0.0.1:3002/health')).ok ? 0 : 1)"]
      interval: 60s
      timeout: 15s
      start_period: 90s
      retries: 3
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: Dockerfile
      # Vite bakes its env into the bundle, so the Clerk frontend key is a *build* input, not a
      # runtime one — changing it needs a rebuild, not a restart. Public by design (it names the
      # instance); the secret half never leaves the api service.
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    restart: unless-stopped
    expose:
      - "80"
    # No `condition: service_healthy` on these: nginx resolves its upstreams lazily (see
    # nginx.conf) precisely so the public entrypoint comes up whether or not the API is ready,
    # and gating it would turn a slow api boot into a 502 for every visitor.
    depends_on:
      - api
      - mcp
    networks:
      # Dokploy's Traefik lives on this external network; without it the domain
      # router can never reach the container (symptom: Traefik default cert + 404).
      - dokploy-network
      - default

networks:
  dokploy-network:
    external: true

volumes:
  pgdata:

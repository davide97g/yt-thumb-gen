# Response headers for everything this server hands a browser.
#
# `include`d per location rather than declared once at server level, because nginx's
# `add_header` is inherited **only** by blocks that declare none of their own — and every static
# location here sets its own Cache-Control. A server-level copy would therefore be silently
# dropped exactly where the HTML is served, which is the one place these matter.

add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# Report-only, deliberately — the same warn-then-enforce shape as THUMBDOC_VALIDATE and
# BLOB_GC. A wrong CSP here would break background removal (onnxruntime fetches its model from
# IMG.LY's CDN and runs it in workers built from blob: URLs) in a way that looks like a broken
# feature rather than a broken header. Watch the reports, then drop `-Report-Only`.
#
# What the editor actually needs, and why:
#   'unsafe-inline' for styles — the canvas positions every layer with inline style attributes;
#   'wasm-unsafe-eval' + blob: for scripts — the background-removal runtime is wasm in a worker;
#   data: and blob: images — documents hold images as data URLs, and exports download as blobs.
#
# Clerk (Google sign-in) is the second origin here, and it needs four of these lists: clerk-js is
# *fetched from the instance's own Frontend API domain*, not from this origin, so `script-src`
# has to name it as well as `connect-src`; `img-src` carries the account avatar; `frame-src`
# covers the flows Clerk completes in an iframe. `*.clerk.accounts.dev` is the development
# instance — a production instance is served from `clerk.<your-domain>` via CNAME, so **add that
# host here when you promote the Clerk instance**, or sign-in reports will start appearing (and
# would break outright if this were ever enforced). Google's own OAuth screen is a top-level
# navigation rather than a subresource, so no directive here governs it.
add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; manifest-src 'self'; img-src 'self' data: blob: https://img.clerk.com; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval' blob: https://*.clerk.accounts.dev; worker-src 'self' blob:; frame-src 'self' https://*.clerk.accounts.dev; connect-src 'self' data: blob: https://staticimgly.com https://cdn.img.ly https://*.clerk.accounts.dev https://clerk-telemetry.com" always;
